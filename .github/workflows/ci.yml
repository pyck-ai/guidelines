name: ci

# `task ci` verifies that the docs and skills only name PR template
# headings and issue forms that exist in pyck-ai/.github, and that the copies
# of them under skills/ are current. It reads a checkout of pyck-ai/.github
# (PYCK_GITHUB_DIR) and fetches nothing itself.
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    runs-on: self-hosted-kata
    permissions:
      contents: read # checkout
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out pyck-ai/.github
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pyck-ai/.github
          path: .pyck-github
      - name: Run the checks
        run: task ci
        env:
          PYCK_GITHUB_DIR: .pyck-github
  ci-success:
    needs: [ci]
    if: always()
    runs-on: self-hosted-kata
    permissions: {}
    steps:
      - uses: pyck-ai/github-actions/gate@04c6f5cd724c6c65a2c2a613f4a97111bbf6347f # main 2026-10-15
        with:
          needs: ${{ toJSON(needs) }}
