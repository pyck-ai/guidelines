name: ci

# `task check` verifies that the docs and skills only name PR template
# headings and issue forms that exist in pyck-ai/.github, and that the copies
# of them under skills/ are current. It reads a checkout of pyck-ai/.github
# (PYCK_GITHUB_DIR) and fetches nothing itself.
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    runs-on: [pyck-ai, firecracker, light]
    permissions:
      contents: read # checkout
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out pyck-ai/.github
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pyck-ai/.github
          path: .pyck-github
          persist-credentials: false
      - name: Run the checks
        run: task check
        env:
          PYCK_GITHUB_DIR: .pyck-github
  zizmor:
    runs-on: [pyck-ai, firecracker, light]
    permissions:
      contents: read # checkout
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          repo-token: ${{ github.token }}
      - name: Scan the workflows
        uses: pyck-ai/github-actions/zizmor@5f9cf06f2b0ec9ccf7647005cfb541d961ca69c3 # main
  gitleaks:
    runs-on: [pyck-ai, firecracker, light]
    permissions:
      contents: read # checkout
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          repo-token: ${{ github.token }}
      - name: Scan the history for secrets
        uses: pyck-ai/github-actions/gitleaks@5f9cf06f2b0ec9ccf7647005cfb541d961ca69c3 # main
  ci-success:
    needs: [ci, zizmor, gitleaks]
    if: always()
    runs-on: [pyck-ai, firecracker, light]
    permissions: {}
    steps:
      - uses: pyck-ai/github-actions/gate@04c6f5cd724c6c65a2c2a613f4a97111bbf6347f # main 2026-10-15
        with:
          needs: ${{ toJSON(needs) }}
