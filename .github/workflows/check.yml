name: check
run-name: Checks

# `task ci` verifies that the docs and skills only name PR template
# headings and issue forms that exist in pyck-ai/.github (the template check
# reads them from its main branch over the network).
on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: self-hosted
    permissions:
      contents: read # checkout
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run the checks
        run: task ci
