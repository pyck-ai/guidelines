version: '3'

tasks:
  ci:
    desc: Check that everything is in order; fails if setup.sh misbehaves or if a doc or skill names a PR template heading or issue form that pyck-ai/.github lacks (PYCK_GITHUB_DIR=<checkout> reads a local copy). CI runs this
    cmds:
      - sh scripts/check-templates.sh
      - sh tests/setup-test.sh
