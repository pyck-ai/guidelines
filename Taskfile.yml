version: '3'

# PYCK_GITHUB_DIR is the pyck-ai/.github checkout the template check and the
# generator read; nothing is fetched.
env:
  PYCK_GITHUB_DIR: '{{.PYCK_GITHUB_DIR | default "../.github"}}'

tasks:
  ci:
    desc: Run every check CI runs; needs zizmor and gitleaks on PATH. CI runs `check`, `zizmor` and `gitleaks` as three parallel jobs, which together are this
    cmds:
      - task: check
      - task: zizmor
      - task: gitleaks
  check:
    desc: Check that docs and skills are in order; fails if setup.sh misbehaves, if a generated file under skills/ is stale, or if a doc or skill names a PR template heading or issue form that pyck-ai/.github lacks. Reads the checkout in PYCK_GITHUB_DIR (default ../.github)
    cmds:
      - sh scripts/check-templates.sh
      - sh scripts/generate-skills.sh --check
      - sh tests/setup-test.sh
      - sh tests/generate-test.sh
  zizmor:
    desc: Scan the workflows for security problems
    # Findings that exist today go in .github/zizmor.yml, which may only
    # shrink. Offline: no token needed.
    cmds:
      - zizmor --offline --no-progress .github
  gitleaks:
    desc: Scan the whole git history for secrets
    # Needs full history: a shallow clone scans fewer commits. Known findings
    # are in .gitleaks-baseline.json, which may only shrink. --redact keeps a
    # secret out of the log.
    cmds:
      - gitleaks git --redact --no-banner --baseline-path .gitleaks-baseline.json .
  generate:
    desc: Write the generated files under skills/ with `sh scripts/generate-skills.sh`; run it after editing docs/. Reads the checkout in PYCK_GITHUB_DIR (default ../.github)
    cmds:
      - sh scripts/generate-skills.sh
